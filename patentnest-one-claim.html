<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>PatentNest</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Newsreader:ital,opsz,wght@0,6..72,400;0,6..72,500;1,6..72,400&family=IBM+Plex+Mono:wght@400&family=Inter:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{
  --ink:#14172a;
  --ink-soft:#5a5d70;
  --ink-faint:#a1a3b0;
  --rule:rgba(20,23,42,.09);
  --cobalt:#1d4ed8;
  --serif:"Newsreader",Georgia,serif;
  --mono:"IBM Plex Mono",ui-monospace,monospace;
  --sans:"Inter",system-ui,sans-serif;
  --ease:cubic-bezier(.16,1,.3,1);
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{
  background:#fff;color:var(--ink);
  font-family:var(--serif);
  -webkit-font-smoothing:antialiased;
  display:flex;flex-direction:column;
  min-height:100svh;overflow:hidden;
}
::selection{background:var(--cobalt);color:#fff}

header,footer{
  flex:none;display:flex;align-items:baseline;justify-content:space-between;
  padding:26px 40px;font-family:var(--mono);font-size:11.5px;
  letter-spacing:.13em;text-transform:uppercase;color:var(--ink-faint);
}
.wordmark{
  font-family:var(--serif);font-size:18px;font-weight:500;letter-spacing:-.01em;
  text-transform:none;color:var(--ink);text-decoration:none;
}
.wordmark span{color:var(--cobalt)}
header a.sign{color:var(--ink-faint);text-decoration:none;transition:color .15s ease}
header a.sign:hover{color:var(--ink)}

main{
  flex:1;display:flex;flex-direction:column;justify-content:center;
  padding:0 40px;max-width:940px;margin:0 auto;width:100%;
}
.kicker{font-family:var(--mono);font-size:12px;letter-spacing:.16em;text-transform:uppercase;color:var(--ink-faint);margin-bottom:30px}
.claim{display:flex;gap:22px;align-items:flex-start}
.claim-no{font-family:var(--mono);font-size:clamp(20px,2.4vw,26px);color:var(--cobalt);line-height:1.5;flex:none}
.claim p{
  font-size:clamp(27px,4.1vw,46px);line-height:1.34;letter-spacing:-.018em;
  max-width:26ch;
}
.claim p em{font-style:italic;color:var(--cobalt)}
.act{margin-top:54px;padding-left:48px}
.btn{
  display:inline-block;font-family:var(--sans);font-size:14.5px;font-weight:500;
  background:var(--cobalt);color:#fff;text-decoration:none;
  padding:13px 30px;border-radius:6px;
  transition:transform .16s var(--ease),background .16s ease,box-shadow .16s ease;
}
.btn:hover{background:#1a44be;transform:translateY(-1px);box-shadow:0 8px 20px -10px rgba(29,78,216,.6)}
.btn:active{transform:scale(.975)}

footer{border-top:1px solid var(--rule);color:var(--ink-faint)}
footer .mid{color:var(--ink-soft);text-transform:none;letter-spacing:0;font-family:var(--sans);font-size:12px}

.f{opacity:0;transform:translateY(10px);animation:rise .85s var(--ease) forwards;animation-delay:var(--d,0ms)}
@keyframes rise{to{opacity:1;transform:none}}

@media (prefers-reduced-motion:reduce){.f{animation:none;opacity:1;transform:none}}
@media (max-width:720px){
  header,footer{padding:20px 22px;font-size:10.5px;letter-spacing:.1em}
  main{padding:0 22px}
  .claim{gap:14px}
  .claim p{max-width:none}
  .act{padding-left:0;margin-top:42px}
  footer{flex-direction:column;align-items:flex-start;gap:8px}
  footer .last{display:none}
}
</style>
</head>
<body>

<header>
  <a class="wordmark f" href="#">Patent<span>Nest</span></a>
  <a class="sign f" style="--d:80ms" href="#">Sign in</a>
</header>

<main>
  <p class="kicker f" style="--d:200ms">We claim:</p>
  <div class="claim">
    <span class="claim-no f" style="--d:320ms">1.</span>
    <p class="f" style="--d:400ms">A method of drafting a complete patent specification <em>in a single day,</em> comprising: a disclosure, and PatentNest.</p>
  </div>
  <div class="act f" style="--d:640ms">
    <a class="btn" href="#">Start</a>
  </div>
</main>

<footer>
  <span class="f" style="--d:820ms">Free for your first specification</span>
  <span class="mid f" style="--d:880ms">No dependent claims.</span>
  <span class="last f" style="--d:940ms">Page 1 of 1</span>
</footer>

</body>
</html>
