<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="720" viewBox="0 0 1200 720" role="img" aria-label="Feature to prior art mapping matrix">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0ea5e9" stop-opacity="0.18"/>
      <stop offset="1" stop-color="#22d3ee" stop-opacity="0.05"/>
    </linearGradient>
    <filter id="glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="10" result="b"/>
      <feMerge>
        <feMergeNode in="b"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <style>
      .panel{fill:rgba(2,6,23,0.72);stroke:rgba(14,165,233,0.22);stroke-width:2}
      .hdr{fill:#ffffff;font:700 20px system-ui,Segoe UI,Roboto,Arial}
      .sub{fill:rgba(226,232,240,0.75);font:500 14px system-ui,Segoe UI,Roboto,Arial}
      .mono{fill:rgba(186,230,253,0.95);font:600 12px ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;letter-spacing:1.6px}
      .grid{stroke:rgba(148,163,184,0.18);stroke-width:1}
      .p{fill:rgba(34,197,94,0.20);stroke:rgba(34,197,94,0.55);stroke-width:1}
      .x{fill:rgba(239,68,68,0.16);stroke:rgba(239,68,68,0.45);stroke-width:1}
      .w{fill:rgba(245,158,11,0.18);stroke:rgba(245,158,11,0.50);stroke-width:1}
      .lbl{fill:rgba(226,232,240,0.82);font:600 12px system-ui,Segoe UI,Roboto,Arial}
      .k{fill:#0ea5e9;filter:url(#glow)}
    </style>
  </defs>

  <rect width="1200" height="720" fill="url(#bg)"/>

  <g transform="translate(120 90)">
    <rect class="panel" x="0" y="0" width="960" height="540" rx="18" ry="18"/>
    <text class="mono" x="28" y="44">EVIDENCE MAP</text>
    <text class="hdr" x="28" y="92">Feature coverage across selected prior art</text>
    <text class="sub" x="28" y="120">Present / Partial / Absent per patent with evidence excerpts.</text>

    <!-- Matrix -->
    <g transform="translate(28 160)">
      <!-- Column labels -->
      <text class="lbl" x="0" y="0">Feature</text>
      <text class="lbl" x="360" y="0">US-XXXX</text>
      <text class="lbl" x="480" y="0">WO-XXXX</text>
      <text class="lbl" x="600" y="0">EP-XXXX</text>
      <text class="lbl" x="720" y="0">CN-XXXX</text>
      <text class="lbl" x="840" y="0">JP-XXXX</text>

      <!-- Grid lines -->
      <path class="grid" d="M0 18H904M0 68H904M0 118H904M0 168H904M0 218H904M0 268H904M0 318H904"/>
      <path class="grid" d="M340 0V318M460 0V318M580 0V318M700 0V318M820 0V318"/>

      <!-- Feature labels -->
      <text class="lbl" x="0" y="52">F1: Core mechanism</text>
      <text class="lbl" x="0" y="102">F2: Control loop</text>
      <text class="lbl" x="0" y="152">F3: Data structure</text>
      <text class="lbl" x="0" y="202">F4: Figure alignment</text>
      <text class="lbl" x="0" y="252">F5: Jurisdiction rules</text>
      <text class="lbl" x="0" y="302">F6: Export pack</text>

      <!-- Cells row 1 -->
      <rect class="p" x="350" y="28" width="90" height="30" rx="8"/>
      <rect class="p" x="470" y="28" width="90" height="30" rx="8"/>
      <rect class="w" x="590" y="28" width="90" height="30" rx="8"/>
      <rect class="x" x="710" y="28" width="90" height="30" rx="8"/>
      <rect class="x" x="830" y="28" width="90" height="30" rx="8"/>

      <!-- Cells row 2 -->
      <rect class="w" x="350" y="78" width="90" height="30" rx="8"/>
      <rect class="p" x="470" y="78" width="90" height="30" rx="8"/>
      <rect class="x" x="590" y="78" width="90" height="30" rx="8"/>
      <rect class="x" x="710" y="78" width="90" height="30" rx="8"/>
      <rect class="x" x="830" y="78" width="90" height="30" rx="8"/>

      <!-- Cells row 3 -->
      <rect class="x" x="350" y="128" width="90" height="30" rx="8"/>
      <rect class="w" x="470" y="128" width="90" height="30" rx="8"/>
      <rect class="x" x="590" y="128" width="90" height="30" rx="8"/>
      <rect class="x" x="710" y="128" width="90" height="30" rx="8"/>
      <rect class="x" x="830" y="128" width="90" height="30" rx="8"/>

      <!-- Cells row 4 -->
      <rect class="x" x="350" y="178" width="90" height="30" rx="8"/>
      <rect class="x" x="470" y="178" width="90" height="30" rx="8"/>
      <rect class="x" x="590" y="178" width="90" height="30" rx="8"/>
      <rect class="w" x="710" y="178" width="90" height="30" rx="8"/>
      <rect class="x" x="830" y="178" width="90" height="30" rx="8"/>

      <!-- Cells row 5 -->
      <rect class="p" x="350" y="228" width="90" height="30" rx="8"/>
      <rect class="w" x="470" y="228" width="90" height="30" rx="8"/>
      <rect class="w" x="590" y="228" width="90" height="30" rx="8"/>
      <rect class="w" x="710" y="228" width="90" height="30" rx="8"/>
      <rect class="w" x="830" y="228" width="90" height="30" rx="8"/>

      <!-- Cells row 6 -->
      <rect class="p" x="350" y="278" width="90" height="30" rx="8"/>
      <rect class="p" x="470" y="278" width="90" height="30" rx="8"/>
      <rect class="p" x="590" y="278" width="90" height="30" rx="8"/>
      <rect class="p" x="710" y="278" width="90" height="30" rx="8"/>
      <rect class="p" x="830" y="278" width="90" height="30" rx="8"/>

      <!-- Legend -->
      <g transform="translate(0 350)">
        <circle class="k" cx="12" cy="10" r="6"/>
        <text class="lbl" x="30" y="14">Present</text>
        <rect class="w" x="120" y="0" width="22" height="18" rx="5"/>
        <text class="lbl" x="150" y="14">Partial</text>
        <rect class="x" x="230" y="0" width="22" height="18" rx="5"/>
        <text class="lbl" x="260" y="14">Absent</text>
      </g>
    </g>
  </g>
</svg>
